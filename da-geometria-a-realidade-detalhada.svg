<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f0d27a"/>
    <stop offset=".48" stop-color="#c9a24a"/>
    <stop offset="1" stop-color="#80672f"/>
  </linearGradient>
  <linearGradient id="fadeGold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c9a24a" stop-opacity=".05"/>
    <stop offset=".5" stop-color="#c9a24a" stop-opacity=".55"/>
    <stop offset="1" stop-color="#c9a24a" stop-opacity=".05"/>
  </linearGradient>
  <radialGradient id="void">
    <stop offset="0" stop-color="#c9a24a" stop-opacity=".10"/>
    <stop offset="1" stop-color="#c9a24a" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .gold{stroke:url(#gold);fill:none}
    .goldFill{fill:#c9a24a}
    .white{fill:#e6e7e8}
    .muted{fill:#858b92}
    .faint{stroke:#34383e;fill:none}
    .deep{stroke:#80672f;fill:none;opacity:.35}
    .ghost{stroke:#c9a24a;fill:none;opacity:.13}
    .h{font:600 17px Arial,sans-serif;letter-spacing:2.8px}
    .k{font:600 13px Arial,sans-serif;letter-spacing:1.35px}
    .b{font:14px Arial,sans-serif}
    .s{font:10px Arial,sans-serif;letter-spacing:1.5px}
    .micro{font:9px Arial,sans-serif;letter-spacing:1.2px}
  </style>
</defs>

<rect width="1600" height="680" fill="#050607"/>

<!-- HEADER -->


<line x1="40" y1="60" x2="1560" y2="60" stroke="#8b6d31"/>

<!-- subtle central field -->
<ellipse cx="800" cy="310" rx="730" ry="250" fill="url(#void)"/>

<!-- CARD 01 -->
<g transform="translate(40 88)">
  <text x="0" y="0" class="goldFill s">DIMENSÃO 01</text>

  <!-- construction cube -->
  <path d="M80 28 L145 65 L80 102 L15 65 Z
           M15 65 V140 L80 177 V102
           M145 65 V140 L80 177
           M80 28 V102" class="gold" stroke-width="2"/>
  <path d="M15 65 L80 102 L145 65 M80 102 V177" class="deep"/>
  <circle cx="80" cy="102" r="3" class="goldFill"/>
  <text x="80" y="214" text-anchor="middle" class="goldFill k">01. CUBO</text>
  <text x="0" y="245" class="white b">
    <tspan x="0">A forma que conhecemos.</tspan>
    <tspan x="0" dy="22">Três dimensões mensuráveis:</tspan>
    <tspan x="0" dy="22">comprimento, largura e altura.</tspan>
  </text>
  <text x="0" y="326" class="muted micro">ESPAÇO CONHECIDO / 3D</text>
  <!-- dimension ticks -->
  
</g>

<line x1="320" y1="88" x2="320" y2="548" class="faint"/>

<!-- CARD 02 -->
<g transform="translate(350 88)">
  <text x="0" y="0" class="goldFill s">DIMENSÃO 02</text>

  <!-- outer cube / inner cube -->
  <path d="M75 14 L145 54 L75 94 L5 54 Z
           M5 54 V137 L75 177 V94
           M145 54 V137 L75 177" class="ghost" stroke-width="1"/>
  <path d="M75 39 L119 64 L75 89 L31 64 Z
           M31 64 V116 L75 141 V89
           M119 64 V116 L75 141
           M75 39 V89" class="gold" stroke-width="2"/>
  <!-- connecting dimension edges -->
  <path d="M5 54 L31 64 M145 54 L119 64 M5 137 L31 116 M145 137 L119 116 M75 177 L75 141" class="gold" stroke-width="1"/>
  <circle cx="75" cy="89" r="3" class="goldFill" filter="url(#softGlow)"/>
  <text x="75" y="214" text-anchor="middle" class="goldFill k">02. HIPERCUBO</text>
  <text x="0" y="245" class="white b">
    <tspan x="0">Uma nova dimensão é adicionada.</tspan>
    <tspan x="0" dy="22">Não vemos o objeto diretamente;</tspan>
    <tspan x="0" dy="22">vemos sua representação.</tspan>
  </text>
  <text x="0" y="326" class="muted micro">RELAÇÃO ENTRE ESPAÇOS / 4D → 3D</text>
</g>

<line x1="640" y1="88" x2="640" y2="548" class="faint"/>

<!-- CARD 03 -->
<g transform="translate(670 88)">
  <text x="0" y="0" class="goldFill s">DIMENSÃO 03</text>

  <!-- projection field -->
  <path d="M80 20 V185 M5 102 H155" class="ghost"/>
  <circle cx="80" cy="102" r="74" class="ghost"/>
  <circle cx="80" cy="102" r="47" class="ghost"/>
  <!-- rays -->
  <path d="M80 102 L10 48 M80 102 L150 48 M80 102 L10 156 M80 102 L150 156" class="deep"/>
  <!-- projected tesseract -->
  <path d="M80 37 L126 63 L80 89 L34 63 Z
           M34 63 V116 L80 142 V89
           M126 63 V116 L80 142
           M80 37 V89" class="gold" stroke-width="2"/>
  <path d="M80 51 L105 65 L80 79 L55 65 Z
           M55 65 V94 L80 108 V79
           M105 65 V94 L80 108" class="gold" stroke-width="1"/>
  <circle cx="80" cy="102" r="4" class="goldFill" filter="url(#softGlow)"/>
  <text x="80" y="214" text-anchor="middle" class="goldFill k">03. PROJEÇÃO</text>
  <text x="0" y="245" class="white b">
    <tspan x="0">A quarta dimensão é projetada</tspan>
    <tspan x="0" dy="22">em três dimensões.</tspan>
    <tspan x="0" dy="22">Profundidade vira linguagem visual.</tspan>
  </text>
  <text x="0" y="326" class="muted micro">ORIGEM → PROJEÇÃO → PERCEPÇÃO</text>
</g>

<line x1="960" y1="88" x2="960" y2="548" class="faint"/>

<!-- CARD 04 -->
<g transform="translate(990 88)">
  <text x="0" y="0" class="goldFill s">DIMENSÃO 04</text>

  <!-- layered perspective -->
  <g opacity=".16" transform="translate(0 0) scale(1.55)">
    <path d="M52 22 L96 47 L52 72 L8 47 Z M8 47 V94 L52 119 V72 M96 47 V94 L52 119" class="gold"/>
  </g>
  <g opacity=".30" transform="translate(10 10) scale(1.28)">
    <path d="M52 22 L96 47 L52 72 L8 47 Z M8 47 V94 L52 119 V72 M96 47 V94 L52 119" class="gold"/>
  </g>
  <g transform="translate(20 20)">
    <path d="M52 22 L96 47 L52 72 L8 47 Z M8 47 V94 L52 119 V72 M96 47 V94 L52 119" class="gold" stroke-width="2"/>
  </g>
  <path d="M52 22 V72 M8 47 L52 72 L96 47" class="deep"/>
  <!-- depth scale -->
  <path d="M5 170 H145" class="faint"/>
  <circle cx="20" cy="170" r="2" class="goldFill"/>
  <circle cx="75" cy="170" r="2" class="goldFill"/>
  <circle cx="130" cy="170" r="2" class="goldFill"/>
  <text x="20" y="190" class="muted micro">PERTO</text>
  <text x="75" y="190" text-anchor="middle" class="muted micro">PLANO</text>
  <text x="130" y="190" text-anchor="end" class="muted micro">DISTANTE</text>
  <text x="80" y="214" text-anchor="middle" class="goldFill k">04. PERSPECTIVA</text>
  <text x="0" y="245" class="white b">
    <tspan x="0">Cada camada ocupa uma posição</tspan>
    <tspan x="0" dy="22">diferente na leitura do espaço.</tspan>
    <tspan x="0" dy="22">O mesmo objeto muda com o ponto de vista.</tspan>
  </text>
  <text x="0" y="326" class="muted micro">PONTO DE VISTA / ESCALA / DISTÂNCIA</text>
</g>

<line x1="1280" y1="88" x2="1280" y2="548" class="faint"/>

<!-- CARD 05 -->
<g transform="translate(1310 88)">
  <text x="0" y="0" class="goldFill s">DIMENSÃO 05</text>

  <!-- recursive infinite tesseract -->
  <g transform="translate(0 0) scale(1.50)" opacity=".10">
    <path d="M52 15 L97 41 L52 67 L7 41 Z M7 41 V88 L52 114 V67 M97 41 V88 L52 114 M52 15 V67" class="gold"/>
  </g>
  <g transform="translate(8 10) scale(1.28)" opacity=".22">
    <path d="M52 15 L97 41 L52 67 L7 41 Z M7 41 V88 L52 114 V67 M97 41 V88 L52 114 M52 15 V67" class="gold"/>
  </g>
  <g transform="translate(18 20) scale(1.08)" opacity=".42">
    <path d="M52 15 L97 41 L52 67 L7 41 Z M7 41 V88 L52 114 V67 M97 41 V88 L52 114 M52 15 V67" class="gold"/>
  </g>
  <path d="M80 42 L120 65 L80 88 L40 65 Z
           M40 65 V108 L80 131 V88
           M120 65 V108 L80 131
           M80 42 V88" class="gold" stroke-width="2.2"/>
  <path d="M80 56 L104 70 L80 84 L56 70 Z
           M56 70 V96 L80 110 V84
           M104 70 V96 L80 110" class="gold" stroke-width="1"/>
  <circle cx="80" cy="88" r="4" class="goldFill" filter="url(#softGlow)"/>
  <text x="80" y="214" text-anchor="middle" class="goldFill k">05. INFINITO</text>
  <text x="0" y="245" class="white b">
    <tspan x="0">Cada perspectiva contém outra.</tspan>
    <tspan x="0" dy="22">A profundidade se repete,</tspan>
    <tspan x="0" dy="22">abrindo novas possibilidades.</tspan>
  </text>
  <text x="0" y="326" class="muted micro">RECURSÃO / NOVA PERSPECTIVA / ∞</text>
</g>

<!-- BOTTOM AXIS -->
<line x1="40" y1="525" x2="1560" y2="525" stroke="#8b6d31"/>
<text x="40" y="552" class="goldFill s"></text>

<!-- progressive depth markers -->
<g transform="translate(220 552)">
  <line x1="0" y1="0" x2="1060" y2="0" stroke="#3a3e44"/>
  <circle cx="0" cy="0" r="3" class="goldFill"/>
  <circle cx="265" cy="0" r="2.5" class="goldFill"/>
  <circle cx="530" cy="0" r="2.5" class="goldFill"/>
  <circle cx="795" cy="0" r="2.5" class="goldFill"/>
  <circle cx="1060" cy="0" r="3" class="goldFill"/>
  <path d="M1060 0 l-10 -5 M1060 0 l-10 5" stroke="#c9a24a" fill="none"/>
</g>
<text x="220" y="575" class="muted micro">FORMA</text>
<text x="485" y="575" text-anchor="middle" class="muted micro">DIMENSÃO</text>
<text x="750" y="575" text-anchor="middle" class="muted micro">PROJEÇÃO</text>
<text x="1015" y="575" text-anchor="middle" class="muted micro">PERSPECTIVA</text>
<text x="1280" y="575" text-anchor="middle" class="goldFill micro">INFINITO</text>

<text x="800" y="620" text-anchor="middle" class="white k">CADA CAMADA NÃO É APENAS MAIS PROFUNDA — É UMA NOVA FORMA DE PERCEBER.</text>

</svg>
