<svg width="220" height="620" viewBox="0 0 220 620" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <style>
    .box { fill: #0d1117; stroke: #C9A961; stroke-width: 1.5; }
    .txt { fill: #C9A961; font-size: 13px; }
    .arrow { stroke: #C9A961; stroke-width: 1.5; }
  </style>

  <!-- CURIOSIDADE -->
  <rect x="10" y="10" width="200" height="40" class="box"/>
  <text x="30" y="35" class="txt">UMA PERGUNTA</text>
  <line x1="110" y1="50" x2="110" y2="80" class="arrow"/>
  <polygon points="105,78 110,90 115,78" fill="#C9A961"/>

  <!-- INVESTIGAÇÃO -->
  <rect x="10" y="90" width="200" height="40" class="box"/>
  <text x="25" y="115" class="txt">INVESTIGAÇÃO</text>
  <line x1="110" y1="130" x2="110" y2="160" class="arrow"/>
  <polygon points="105,158 110,170 115,158" fill="#C9A961"/>

  <!-- CONSTRUÇÃO -->
  <rect x="10" y="170" width="200" height="40" class="box"/>
  <text x="30" y="195" class="txt">CONSTRUÇÃO</text>
  <line x1="110" y1="210" x2="110" y2="240" class="arrow"/>
  <polygon points="105,238 110,250 115,238" fill="#C9A961"/>

  <!-- TESTES -->
  <rect x="10" y="250" width="200" height="40" class="box"/>
  <text x="55" y="275" class="txt">TESTES</text>
  <line x1="110" y1="290" x2="110" y2="320" class="arrow"/>
  <polygon points="105,318 110,330 115,318" fill="#C9A961"/>

  <!-- ENTENDIMENTO -->
  <rect x="10" y="330" width="200" height="40" class="box"/>
  <text x="20" y="355" class="txt">ENTENDIMENTO</text>
  <line x1="110" y1="370" x2="110" y2="400" class="arrow"/>
  <polygon points="105,398 110,410 115,398" fill="#C9A961"/>

  <!-- NOVA CURIOSIDADE -->
  <rect x="10" y="410" width="200" height="40" class="box"/>
  <text x="15" y="435" class="txt">UMA NOVA PERGUNTA</text>
</svg>
